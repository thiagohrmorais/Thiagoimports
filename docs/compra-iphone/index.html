<footer style="background:var(--card);border-top:1px solid var(--border);padding:24px 20px;margin-top:auto;text-align:center;">
  <div style="max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;">
    <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);flex-wrap:wrap;justify-content:center;">
      <span style="background:rgba(241,0,160,0.15);padding:6px 14px;border-radius:20px;border:1px solid var(--accent);color:var(--accent);font-weight:600;">
        📱 100% Mobile-First · Desenvolvido inteiramente por um iPhone (Sem Computador)
      </span>
    </div>
    <p style="color:var(--muted);font-size:12px;margin:0;">
      © 2026 thiagoimports. Todos os direitos reservados.
    </p>
  </div>
</footer>

<script>
// CONFIGURAÇÃO DO WHATSAPP DA EMPRESA (Ajuste o número com seu DDD)
const TELEFONE_EMPRESA = "5581999999999"; 

function fmt(v){ 
  if(!isFinite(v) || isNaN(v)) return '—'; 
  const s = v < 0 ? '− ' : ''; 
  return s + 'R$ ' + Math.abs(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); 
}

function num(id){ 
  const e = document.getElementById(id); 
  if(!e) return 0;
  const val = parseFloat(e.value);
  return isNaN(val) ? 0 : val;
}

function set(id, val){ 
  const e = document.getElementById(id); 
  if(e) e.textContent = val; 
}

function f(id){ 
  const e = document.getElementById(id); 
  if(!e) return 1;
  const val = parseFloat(e.value);
  return isNaN(val) ? 1 : val;
}

function txtSel(id){ 
  const e = document.getElementById(id); 
  return e && e.options && e.options[e.selectedIndex] ? e.options[e.selectedIndex].text : ''; 
}

function calcIP(){
  try{
    const nomeEl = document.getElementById('ip_nome');
    const nome = (nomeEl && nomeEl.value.trim()) ? nomeEl.value.trim() : 'Cliente';
    
    const modTexto = txtSel('ip_modelo');
    const base = num('ip_modelo');
    const armaz = f('ip_armaz');
    const armazTexto = txtSel('ip_armaz');

    const tela = f('ip_tela');
    const vidro = f('ip_vidro');
    const marcas = f('ip_marcas');
    const bateria = f('ip_bateria');
    const pecas = f('ip_pecas');
    const faceid = f('ip_faceid');
    const agua = f('ip_agua');
    const caixa = f('ip_caixa');
    const garant = f('ip_garant');

    const mercado = base * armaz;
    const apos20 = mercado * 0.80;
    const fat = tela * vidro * marcas * bateria * pecas * faceid * agua * caixa * garant;
    const precoMax = Math.round(apos20 * fat);

    const score = Math.min(100, Math.round(fat * 100));
    let scoreLabel = "";
    if(score >= 85) scoreLabel = "Excelente Estado";
    else if(score >= 70) scoreLabel = "Bom Estado";
    else if(score >= 50) scoreLabel = "Estado Regular";
    else scoreLabel = "Necessita de Reparos";

    set('ip_scoreNum', score + "/100"); 
    set('ip_scoreLabel', scoreLabel);
    set('ip_mMax', fmt(precoMax));

    const resumo = `• Modelo: ${modTexto} (${armazTexto})\n` +
                   `• Tela: ${txtSel('ip_tela')}\n` +
                   `• Traseira: ${txtSel('ip_vidro')}\n` +
                   `• Estrutura: ${txtSel('ip_marcas')}\n` +
                   `• Bateria: ${txtSel('ip_bateria')}\n` +
                   `• Peças: ${txtSel('ip_pecas')}\n` +
                   `• Face ID: ${txtSel('ip_faceid')}\n` +
                   `• Acessórios: ${txtSel('ip_caixa')}`;
    
    set('ip_resumo', resumo);

    // Montar Mensagem Pré-Configurada para o WhatsApp
    const msgWsp = `*PRÉ-AVALIAÇÃO DE IPHONE - THIAGOIMPORTS*\n\n` +
                   `👤 *Nome:* ${nome}\n` +
                   `📱 *Aparelho:* ${modTexto} (${armazTexto})\n` +
                   `📊 *Pontuação estimada:* ${score}/100 (${scoreLabel})\n\n` +
                   `*Detalhes informados:*\n` +
                   `- Tela: ${txtSel('ip_tela')}\n` +
                   `- Vidro Traseiro: ${txtSel('ip_vidro')}\n` +
                   `- Bateria: ${txtSel('ip_bateria')}\n` +
                   `- Peças: ${txtSel('ip_pecas')}\n` +
                   `- Face ID: ${txtSel('ip_faceid')}\n` +
                   `- Contato com água: ${txtSel('ip_agua')}\n` +
                   `- Caixa/Acessórios: ${txtSel('ip_caixa')}\n\n` +
                   `💰 *Valor estimado da Pré-Avaliação:* ${fmt(precoMax)}\n\n` +
                   `_Gostaria de agendar a pós-avaliação técnica em loja para confirmar o pagamento!_`;

    const wspBtn = document.getElementById('ip_wspBtn');
    if(wspBtn){
      wspBtn.href = `https://wa.me/${TELEFONE_EMPRESA}?text=${encodeURIComponent(msgWsp)}`;
    }

  } catch(err){ 
    console.error('Erro no cálculo do iPhone:', err); 
  }
}

document.addEventListener('DOMContentLoaded', calcIP);
calcIP();
</script>
</body>
</html>
