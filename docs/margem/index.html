<footer style="background:var(--card);border-top:1px solid var(--border);padding:24px 20px;margin-top:auto;text-align:center;">
  <div style="max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;">
    <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);flex-wrap:wrap;justify-content:center;">
      <span style="background:rgba(241,0,160,0.15);padding:6px 14px;border-radius:20px;border:1px solid var(--accent);color:var(--accent);font-weight:600;">
        📱 100% Mobile-First · Desenvolvido inteiramente por um iPhone (Sem Computador)
      </span>
    </div>
    <p style="color:var(--muted);font-size:12px;margin:0;">
      © 2026 thiagoimports. Todos os direitos reservados.
    </p>
  </div>
</footer>

<script>
function fmt(v){ 
  if(!isFinite(v) || isNaN(v)) return '—'; 
  const s = v < 0 ? '− ' : ''; 
  return s + 'R$ ' + Math.abs(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); 
}

function pct(v){ 
  if(!isFinite(v) || isNaN(v)) return '—'; 
  const s = v < 0 ? '− ' : ''; 
  return s + Math.abs(v).toFixed(1).replace('.',',') + '%'; 
}

function num(id){ 
  const e = document.getElementById(id); 
  if(!e) return 0;
  const val = parseFloat(e.value);
  return isNaN(val) ? 0 : val;
}

function set(id, val){ 
  const e = document.getElementById(id); 
  if(e) e.textContent = val; 
}

function calcMargem(){
  try{
    const custo = num('inCusto');
    const preco = num('inPreco');
    const imp = num('inImp');
    const plat = num('inPlat');
    const pagSel = document.getElementById('inPag'); 
    const pag = pagSel ? (parseFloat(pagSel.value) || 0) : 0;
    
    const km = num('inKm');
    const fuel = num('inFuel');
    const desg = num('inDesg');
    const ped = num('inPed');
    const outros = num('inOutros');
    const alvo = num('inAlvo');

    const vImp = preco * (imp / 100);
    const vPag = preco * (pag / 100);
    const vPlat = preco * (plat / 100);
    
    const vRota = km * (fuel + desg);
    const vRotaTotal = vRota + ped;
    const totalOutros = outros + ped;

    const total = custo + vImp + vPag + vPlat + vRotaTotal + outros;
    const lucro = preco - total;
    const margem = preco > 0 ? (lucro / preco) * 100 : 0;
    const markup = custo > 0 ? ((preco - custo) / custo) * 100 : 0;

    const taxaSoma = imp + pag + plat;
    const custosFixos = custo + vRotaTotal + outros;
    
    const denomEq = 1 - (taxaSoma / 100); 
    const eq = denomEq > 0 ? custosFixos / denomEq : Infinity;

    const denomAlvo = 1 - ((taxaSoma + alvo) / 100); 
    const pAlvo = denomAlvo > 0 ? custosFixos / denomAlvo : Infinity;

    set('oCustoTotal', fmt(total)); 
    set('oLucro', fmt(lucro));

    const elLucro = document.getElementById('oLucro'); 
    if(elLucro) elLucro.style.color = lucro >= 0 ? 'var(--accent2)' : 'var(--danger)';

    set('oMargem', 'Margem: ' + pct(margem) + ' sobre a venda · Markup: ' + pct(markup) + ' sobre o custo');
    set('oEq', fmt(eq));

    if(pAlvo !== Infinity && pAlvo > 0){ 
      set('oAlvo', fmt(pAlvo)); 
      set('oAlvoTxt', 'Para atingir ' + alvo.toFixed(1).replace('.',',') + '% de margem líquida com esta forma de pagamento.'); 
    } else { 
      set('oAlvo', 'Inviável'); 
      set('oAlvoTxt', 'A soma dos impostos, taxas e margem alvo é igual ou superior a 100%.'); 
    }

    set('dProd', fmt(custo)); 
    set('dImp', fmt(vImp)); 
    set('dPag', fmt(vPag)); 
    set('dPlat', fmt(vPlat)); 
    set('dRota', fmt(vRota)); 
    set('dOutros', fmt(totalOutros)); 
    set('dTotal', fmt(total));
    set('cmpPreco', fmt(preco));

    const taxas = [0, 2.5, 3.99, 5.99];
    for(let i = 0; i < 4; i++){ 
      const t = taxas[i]; 
      const vt = preco * (t / 100); 
      const l = preco - (custo + vImp + vt + vPlat + vRotaTotal + outros); 
      const m = preco > 0 ? (l / preco) * 100 : 0;

      set('c' + (i + 1) + 'L', fmt(l)); 
      const elL = document.getElementById('c' + (i + 1) + 'L'); 
      if(elL) elL.style.color = l >= 0 ? 'var(--text)' : 'var(--danger)';

      set('c' + (i + 1) + 'M', pct(m)); 
      const elM = document.getElementById('c' + (i + 1) + 'M'); 
      if(elM) elM.style.color = m >= 0 ? (i === 0 ? 'var(--accent2)' : 'var(--text)') : 'var(--danger)'; 
    }
  } catch(err) { 
    console.error('Erro no cálculo de margem:', err); 
  }
}

document.addEventListener('DOMContentLoaded', calcMargem);
calcMargem();
</script>
</body>
</html>
