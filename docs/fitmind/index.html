<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Apex Mind & Iron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg-dark: #06050a;
    --glass-bg: rgba(18, 12, 32, 0.7);
    --glass-border: rgba(241, 0, 160, 0.25);
    --text-primary: #f8f6fc;
    --text-muted: #9e8cb8;
    --accent-pink: #f100a0;
    --accent-purple: #9d4edd;
    --accent-cyan: #00f0ff;
    --accent-green: #25d366;
    --input-bg: rgba(13, 8, 22, 0.8);
  }

  * {
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box;
  }

  body { 
    background: var(--bg-dark); 
    color: var(--text-primary); 
    font-family: 'Plus Jakarta Sans', sans-serif; 
    margin: 0; 
    min-height: 100vh;
    padding-bottom: 120px;
  }

  .hfont { font-family: 'Outfit', sans-serif; }

  .ios-glass {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    border-radius: 20px;
  }

  input, select, textarea {
    background-color: var(--input-bg);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 10px 14px;
    color: var(--text-primary);
    width: 100%;
    font-size: 13px;
    transition: border-color 0.2s;
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent-pink);
  }

  .score-badge {
    background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
    color: white;
    padding: 6px 14px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 700;
  }
</style>
</head>
<body>

<div style="max-width:600px;margin:0 auto;padding:16px;width:100%;">

  <!-- HEADER E SCORE -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
    <div>
      <span style="font-size:11px;font-weight:700;color:var(--accent-purple);text-transform:uppercase;">Apex Mind & Iron</span>
      <h1 class="hfont" style="font-size:24px;font-weight:800;color:#fff;">Performance Diária</h1>
    </div>
    <div style="text-align:center;">
      <span style="font-size:9px;color:var(--text-muted);display:block;margin-bottom:2px;">SCORE TOTAL</span>
      <div id="totalScore" class="score-badge">0 pts</div>
    </div>
  </div>

  <!-- CONFIGURAÇÃO WHATSAPP -->
  <div class="ios-glass" style="padding:12px 16px;margin-bottom:20px;">
    <div style="display:flex;align-items:center;gap:12px;">
      <span style="font-size:12px;font-weight:700;color:var(--accent-green);">📱 WhatsApp:</span>
      <input type="text" id="cfg_phone" placeholder="DDD + Número (Ex: 81999998888)" oninput="autoSaveAll()" style="font-size:12px;">
    </div>
  </div>

  <!-- SEÇÃO AUDIO E INSIGHT -->
  <section class="ios-glass" style="padding:16px;margin-bottom:20px;border-color:rgba(0,240,255,0.4);">
    <div style="margin-bottom:12px;">
      <span style="font-size:12px;font-weight:700;color:var(--accent-cyan);">🎧 Foco Mental: O que está ouvindo?</span>
      <input type="text" id="in_audio" placeholder="Nome do audiolivro / podcast..." oninput="autoSaveAll()" style="margin-top:8px;">
    </div>
    <div>
      <span style="font-size:12px;font-weight:700;color:var(--text-primary);">💡 Reflexão do Áudio:</span>
      <textarea id="in_insight" rows="2" placeholder="O que achou do conteúdo de hoje?" oninput="autoSaveAll()" style="margin-top:8px;"></textarea>
    </div>
  </section>

  <!-- PROTOCOLO DE TREINO -->
  <section class="ios-glass" style="padding:16px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <span style="font-size:14px;font-weight:700;color:var(--accent-pink);">💪 Protocolo de Treino</span>
      <select id="sel_tipo" onchange="autoSaveAll()" style="width:auto;font-size:12px;padding:4px 8px;">
        <option value="Musculação">Musculação</option>
        <option value="Natação">Natação</option>
        <option value="Aeróbicos">Aeróbicos</option>
      </select>
    </div>

    <!-- ADICIONAR EXERCÍCIO -->
    <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:16px;">
      <input type="text" id="in_ex_nome" placeholder="Exercício / Atividade">
      <input type="text" id="in_ex_series" placeholder="Séries">
      <input type="text" id="in_ex_rep" placeholder="Reps / Tempo">
    </div>
    <button onclick="addEx()" style="width:100%;padding:10px;border-radius:12px;background:linear-gradient(135deg, var(--accent-pink), var(--accent-purple));color:#fff;font-weight:700;font-size:13px;border:none;cursor:pointer;">
      ➕ Adicionar Exercício
    </button>

    <!-- LISTA DE EXERCÍCIOS -->
    <div id="listaEx" style="margin-top:16px;display:flex;flex-direction:column;gap:8px;">
      <!-- Exercícios adicionados aqui -->
    </div>
  </section>

  <!-- BOTÃO ENVIAR -->
  <a id="btnWhatsApp" href="#" target="_blank" style="margin-top:24px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:16px;background:#25d366;color:#fff;font-size:14px;font-weight:800;text-decoration:none;box-shadow:0 8px 20px rgba(37,211,102,0.4);">
    💬 Enviar Relatório Diário
  </a>

</div>

<script>
let state = {
  phone: "",
  audio: "",
  insight: "",
  tipoTreino: "Musculação",
  exercicios: []
};

function init() {
  const saved = localStorage.getItem('apex_data');
  if (saved) {
    try { state = JSON.parse(saved); } catch(e){}
  }

  document.getElementById('cfg_phone').value = state.phone || "";
  document.getElementById('in_audio').value = state.audio || "";
  document.getElementById('in_insight').value = state.insight || "";
  document.getElementById('sel_tipo').value = state.tipoTreino || "Musculação";

  renderEx();
  calculateScore();
  updateWhatsAppLink();
}

function autoSaveAll() {
  state.phone = document.getElementById('cfg_phone').value;
  state.audio = document.getElementById('in_audio').value;
  state.insight = document.getElementById('in_insight').value;
  state.tipoTreino = document.getElementById('sel_tipo').value;
  localStorage.setItem('apex_data', JSON.stringify(state));
  
  updateWhatsAppLink();
}

function addEx() {
  const nome = document.getElementById('in_ex_nome').value.trim();
  const series = document.getElementById('in_ex_series').value.trim();
  const rep = document.getElementById('in_ex_rep').value.trim();

  if (!nome || !series || !rep) {
    alert("Preencha todos os campos do exercício!");
    return;
  }

  state.exercicios.push({ nome, series, rep });
  document.getElementById('in_ex_nome').value = '';
  document.getElementById('in_ex_series').value = '';
  document.getElementById('in_ex_rep').value = '';

  localStorage.setItem('apex_data', JSON.stringify(state));
  renderEx();
  calculateScore();
  updateWhatsAppLink();
}

function removeEx(idx) {
  state.exercicios.splice(idx, 1);
  localStorage.setItem('apex_data', JSON.stringify(state));
  renderEx();
  calculateScore();
  updateWhatsAppLink();
}

function renderEx() {
  const container = document.getElementById('listaEx');
  if (state.exercicios.length === 0) {
    container.innerHTML = `<span style="font-size:12px;color:var(--text-muted);font-style:italic;text-align:center;">Nenhum exercício adicionado.</span>`;
    return;
  }

  let html = '';
  state.exercicios.forEach((ex, idx) => {
    html += `
      <div class="ios-glass" style="padding:10px 14px;display:flex;align-items:center;justify-content:space-between;">
        <div style="font-size:12px;">
          <strong style="color:#fff;display:block;">${ex.nome}</strong>
          <span style="color:var(--accent-pink);">${ex.series}</span> · <span style="color:var(--accent-cyan);">${ex.rep}</span>
        </div>
        <button onclick="removeEx(${idx})" style="background:none;border:none;color:var(--text-muted);font-size:14px;cursor:pointer;padding:4px;">✕</button>
      </div>
    `;
  });
  container.innerHTML = html;
}

function calculateScore() {
  const exCount = state.exercicios.length;
  const score = exCount * 105;
  document.getElementById('totalScore').textContent = `${score} pts`;
}

function updateWhatsAppLink() {
  const hoje = new Date().toLocaleDateString('pt-BR');
  let msg = `*RELATÓRIO DE PERFORMANCE APEX* 🚀\n`;
  msg += `*Data:* ${hoje}\n\n`;

  msg += `*🔊 Foco Mental (Áudio):* ${state.audio || 'Nenhum'}\n`;
  msg += `*💡 Insights:* "${state.insight || 'Sem insights'}"\n\n`;

  msg += `*💪 Treino (${state.tipoTreino}):*\n`;
  if (state.exercicios.length > 0) {
    state.exercicios.forEach(ex => {
      msg += `• *${ex.nome}:* ${ex.series} / ${ex.rep}\n`;
    });
  } else {
    msg += `• Nenhum exercício.\n`;
  }

  const exCount = state.exercicios.length;
  const score = exCount * 105;
  msg += `\n🏆 *Score Diário:* ${score} pts`;

  const btn = document.getElementById('btnWhatsApp');
  const cleanPhone = (state.phone || '').replace(/\D/g, '');
  btn.href = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`;
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
