<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FitVox · Performance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
--bg-dark: #07040d;
--glass-bg: rgba(20, 12, 34, 0.75);
--glass-border: rgba(241, 0, 160, 0.25);
--text-primary: #f8f6fc;
--text-muted: #9e8cb8;
--accent-pink: #f100a0;
--accent-purple: #9d4edd;
--accent-cyan: #00f0ff;
--accent-green: #25d366;
--input-bg: rgba(13, 7, 22, 0.85);
}
* {
-webkit-tap-highlight-color: transparent;
box-sizing: border-box;
}
body {
background: var(--bg-dark);
color: var(--text-primary);
font-family: 'Plus Jakarta Sans', sans-serif;
margin: 0;
min-height: 100vh;
padding-bottom: 120px;
}
.hfont { font-family: 'Outfit', sans-serif; }
/* Glassmorphism Cards */
.ios-glass {
background: var(--glass-bg);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border: 1px solid var(--glass-border);
box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
border-radius: 20px;
}
/* Inputs */
input, select, textarea {
background-color: var(--input-bg);
border: 1px solid var(--glass-border);
border-radius: 12px;
padding: 10px 12px;
color: var(--text-primary);
width: 100%;
font-size: 13px;
transition: border-color 0.2s;
}
input:focus, select:focus, textarea:focus {
outline: none;
border-color: var(--accent-pink);
box-shadow: 0 0 0 2px rgba(241, 0, 160, 0.25);
}
/* Category Chips */
.chip-btn {
padding: 6px 12px;
border-radius: 10px;
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.12);
color: var(--text-muted);
font-size: 11px;
font-weight: 700;
cursor: pointer;
white-space: nowrap;
transition: all 0.15s ease;
}
.chip-btn:active, .chip-btn:hover {
background: rgba(241, 0, 160, 0.2);
border-color: var(--accent-pink);
color: #ffffff;
}
/* Custom Checkbox estilo FitNote24 */
.set-check {
appearance: none;
width: 22px;
height: 22px;
border-radius: 6px;
border: 2px solid var(--glass-border);
background: rgba(13, 7, 22, 0.8);
cursor: pointer;
display: inline-flex;
align-items: center;
justify-content: center;
transition: all 0.15s ease;
}
.set-check:checked {
background: var(--accent-green);
border-color: var(--accent-green);
}
.set-check:checked::after {
content: '✓';
color: #000;
font-size: 13px;
font-weight: 900;
}
.save-indicator {
position: fixed;
top: 12px;
right: 16px;
font-size: 11px;
color: var(--accent-green);
font-weight: 700;
display: flex;
align-items: center;
gap: 4px;
opacity: 0;
transition: opacity 0.3s ease;
z-index: 100;
}
.save-indicator.show { opacity: 1; }
.score-badge {
background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
color: #fff;
padding: 4px 12px;
border-radius: 99px;
font-size: 12px;
font-weight: 800;
box-shadow: 0 0 15px rgba(241,0,160,0.4);
}
</style>
</head>
<body>
<div id="saveIndicator" class="save-indicator">
<span>✓ Salvo no aparelho</span>
</div>
<div style="max-width: 650px; margin: 0 auto; padding: 16px; width: 100%;">
<!-- HEADER FITVOX -->
<header class="flex items-center justify-between mb-4 pt-1">
<div>
<div class="flex items-center gap-2">
<span class="text-[10px] font-extrabold tracking-wider uppercase text-[var(--accent-cyan)]">FitVox Engine</span>
<span class="text-[9px] font-extrabold px-2 py-0.5 rounded-full bg-[var(--accent-pink)]/20 text-[var(--accent-pink)] border border-[var(--accent-pink)]/40">FitNote24 Style</span>
</div>
<h1 class="hfont text-2xl font-extrabold text-white tracking-tight">Diário de Treino</h1>
</div>
<a id="btnTopWhatsApp" href="#" target="_blank" class="flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-[var(--accent-green)] text-white text-xs font-extrabold no-underline shadow-lg shadow-emerald-500/20">
<span>💬</span>
<span>Enviar</span>
</a>
</header>
<!-- CONFIGURAÇÃO RÁPIDA DE WHATSAPP -->
<div class="ios-glass p-3 mb-3 flex items-center gap-3">
<span class="text-xs font-bold text-[var(--accent-green)] whitespace-nowrap">📱 WhatsApp:</span>
<input type="text" id="cfg_phone" placeholder="DDD + Número (Ex: 81999998888)" oninput="autoSaveAll()" class="w-full text-xs">
</div>
<!-- PAINEL 1: REST TIMER COM SOM -->
<section class="ios-glass p-4 mb-3 border-[rgba(0,240,255,0.3)] bg-[rgba(10,20,38,0.7)]">
<div class="flex items-center justify-between mb-2">
<span class="text-xs font-extrabold text-[var(--accent-cyan)] uppercase tracking-wider">⏱️ Timer de Descanso Entre Séries</span>
<strong id="timerDisplay" class="text-lg font-mono font-black text-[var(--accent-pink)]">01:00</strong>
</div>
<div class="flex gap-1.5 overflow-x-auto pb-1">
<button class="chip-btn" onclick="startTimer(30)">⚡ 30s</button>
<button class="chip-btn" onclick="startTimer(60)">⚡ 60s (1 min)</button>
<button class="chip-btn" onclick="startTimer(90)">⚡ 90s</button>
<button class="chip-btn" onclick="startTimer(120)">⚡ 120s (2 min)</button>
<button class="chip-btn text-red-400 border-red-500/30" onclick="stopTimer()">⏹️ Parar</button>
</div>
</section>
<!-- PAINEL 2: GERENCIADOR DE PROTOCOLOS E TREINO -->
<section class="ios-glass p-4 mb-3">
<div class="flex items-center justify-between mb-3">
<h2 class="text-xs font-extrabold text-white uppercase tracking-wider flex items-center gap-1.5">
<span>📋</span> PROTOCOLOS & EXERCÍCIOS
</h2>
<button onclick="salvarNovoProtocolo()" class="text-[10px] font-bold text-[var(--accent-cyan)] bg-[rgba(0,240,255,0.1)] px-2.5 py-1 rounded-lg border border-[var(--accent-cyan)]/40">
💾 Salvar Protocolo
</button>
</div>
<div class="grid grid-cols-2 gap-2 mb-3">
<select id="sel_protocolo" onchange="carregarProtocolo()" class="text-xs font-bold">
<option value="padrao">-- Selecionar Protocolo --</option>
</select>
<input type="text" id="in_nome_protocolo" placeholder="Novo Protocolo (Ex: Peito A)" class="text-xs">
</div>
<!-- AMPLA GAMA DE PRESETS RÁPIDOS POR CATEGORIA -->
<div class="mb-3">
<label class="text-[10px] text-[var(--text-muted)] font-bold block mb-1 uppercase">Presets Rápidos (Selecione para Adicionar):</label>
<div class="flex gap-1.5 overflow-x-auto pb-2">
<!-- Peito & Ombro -->
<button class="chip-btn" onclick="quickAdd('Supino Reto (Barra)', 'Musculação', 4, '10 reps @ 60kg')">🏋️ Supino Reto</button>
<button class="chip-btn" onclick="quickAdd('Supino Inclinado (Halter)', 'Musculação', 4, '10 reps @ 24kg')">🏋️ Sup. Inclinado</button>
<button class="chip-btn" onclick="quickAdd('Crossover Polia', 'Musculação', 3, '12 reps @ 20kg')">💪 Crossover</button>
<button class="chip-btn" onclick="quickAdd('Desenvolvimento Ombro', 'Musculação', 4, '10 reps @ 18kg')">🏋️ Dev. Ombro</button>
<button class="chip-btn" onclick="quickAdd('Elevação Lateral', 'Musculação', 4, '12 reps @ 12kg')">🏋️ Elev. Lateral</button>
<!-- Costas & Braços -->
<button class="chip-btn" onclick="quickAdd('Puxada Alta Frontal', 'Musculação', 4, '12 reps @ 50kg')">💪 Puxada Alta</button>
<button class="chip-btn" onclick="quickAdd('Remada Curvada', 'Musculação', 4, '10 reps @ 40kg')">🏋️ Remada Curvada</button>
<button class="chip-btn" onclick="quickAdd('Rosca Direta W', 'Musculação', 4, '10 reps @ 20kg')">💪 Rosca Direta</button>
<button class="chip-btn" onclick="quickAdd('Tríceps Corda', 'Musculação', 4, '12 reps @ 25kg')">💪 Tríceps Corda</button>
<!-- Pernas -->
<button class="chip-btn" onclick="quickAdd('Agachamento Livre', 'Musculação', 4, '10 reps @ 80kg')">🦵 Agachamento</button>
<button class="chip-btn" onclick="quickAdd('Leg Press 45°', 'Musculação', 4, '12 reps @ 160kg')">🦵 Leg Press</button>
<button class="chip-btn" onclick="quickAdd('Stiff / Terra', 'Musculação', 4, '8 reps @ 80kg')">🏋️ Stiff</button>
<button class="chip-btn" onclick="quickAdd('Elevação Pélvica', 'Musculação', 4, '10 reps @ 100kg')">🦵 Elev. Pélvica</button>
<!-- Natação -->
<button class="chip-btn" onclick="quickAdd('Natação: Crawl Livre', 'Natação', 1, '1000m em 30 min')">🏊 Crawl 1000m</button>
<button class="chip-btn" onclick="quickAdd('Natação: Peito', 'Natação', 1, '500m em 20 min')">🏊 Peito 500m</button>
<button class="chip-btn" onclick="quickAdd('Natação: Costas', 'Natação', 1, '500m em 20 min')">🏊 Costas 500m</button>
<!-- Aeróbicos -->
<button class="chip-btn" onclick="quickAdd('Corrida Esteira/Rua', 'Aeróbico', 1, '5 km em 25 min')">🏃 Corrida 5km</button>
<button class="chip-btn" onclick="quickAdd('Ciclismo / Bike', 'Aeróbico', 1, '15 km em 40 min')">🚴 Bike 15km</button>
<button class="chip-btn" onclick="quickAdd('HIIT Pular Corda', 'Aeróbico', 1, '15 minutos')">⏱️ Corda 15min</button>
</div>
</div>
<!-- ADIÇÃO MANUAL COMPACTA -->
<div class="grid grid-cols-12 gap-2 mb-3 bg-black/40 p-2.5 rounded-xl border border-[var(--glass-border)]">
<input type="text" id="in_ex_nome" placeholder="Exercício ou Atividade" class="col-span-5 text-xs">
<select id="in_ex_cat" class="col-span-3 text-xs">
<option value="Musculação">Musculação</option>
<option value="Natação">Natação</option>
<option value="Aeróbico">Aeróbico</option>
</select>
<input type="text" id="in_ex_series" placeholder="Séries" value="4" class="col-span-2 text-xs text-center">
<input type="text" id="in_ex_detalhes" placeholder="Reps / Carga" value="10 reps @ 40kg" class="col-span-2 text-xs">
<button onclick="addExercicioManualmente()" class="col-span-12 py-2 rounded-xl bg-gradient-to-r from-[var(--accent-pink)] to-[var(--accent-purple)] text-white font-bold text-xs border-none cursor-pointer shadow-md">
➕ Adicionar ao Treino de Hoje
</button>
</div>
<!-- LISTA DE EXERCÍCIOS ESTILO FITNOTE24 -->
<div id="listaExercicios" class="flex flex-col gap-2.5">
<!-- Renderizado dinamicamente -->
</div>
</section>
<!-- PAINEL 3: VISION VOX (MENTE & INSIGHTS) -->
<section class="ios-glass p-4 mb-4 border-[rgba(0,240,255,0.3)]">
<div class="flex items-center justify-between mb-2">
<h2 class="text-xs font-extrabold text-[var(--accent-cyan)] uppercase tracking-wider flex items-center gap-1.5">
<span>🎧</span> VISIONVOX · FOCO MENTAL & CONHECIMENTO
</h2>
</div>
<div class="flex flex-col gap-2">
<div>
<label class="text-[10px] text-[var(--text-muted)] font-bold block mb-1">O que você estava ouvindo no VisionVox durante o treino?</label>
<input type="text" id="in_audiolivro" placeholder="Ex: A Arte da Guerra — Capítulo 3" oninput="autoSaveAll()" class="w-full text-xs">
</div>
<div>
<label class="text-[10px] text-[var(--text-muted)] font-bold block mb-1">💡 Principais Insights / Opinião sobre o Conteúdo:</label>
<textarea id="in_insight" rows="2" placeholder="Digite seus aprendizados, ideias e reflexões..." oninput="autoSaveAll()" class="w-full text-xs"></textarea>
</div>
</div>
</section>
<!-- BOTÃO ENVIO WHATSAPP -->
<a id="btnBottomWhatsApp" href="#" target="_blank" class="w-full py-3.5 rounded-2xl bg-[var(--accent-green)] text-white font-extrabold text-sm no-underline flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/25">
<span>💬</span> ENVIAR RELATÓRIO DO TREINO NO WHATSAPP
</a>
</div>
<script>
let timerInterval = null;
let timerSeconds = 0;
let state = {
phone: "",
audioLivro: "",
insight: "",
exercicios: [],
protocolos: {}
};
function init() {
const saved = localStorage.getItem('fitvox_tracker_data');
if (saved) {
try { state = JSON.parse(saved); } catch(e){}
}
document.getElementById('cfg_phone').value = state.phone || "";
document.getElementById('in_audiolivro').value = state.audioLivro || "";
document.getElementById('in_insight').value = state.insight || "";
renderExercicios();
renderProtocolosSelect();
updateWhatsAppLinks();
}
function autoSaveAll() {
state.phone = document.getElementById('cfg_phone').value;
state.audioLivro = document.getElementById('in_audiolivro').value;
state.insight = document.getElementById('in_insight').value;
localStorage.setItem('fitvox_tracker_data', JSON.stringify(state));
showSaveIndicator();
updateWhatsAppLinks();
}
function showSaveIndicator() {
const ind = document.getElementById('saveIndicator');
if (ind) {
ind.classList.add('show');
clearTimeout(window._saveTimer);
window._saveTimer = setTimeout(() => ind.classList.remove('show'), 1200);
}
}
// TIMER COM SOUND ALERT NATIVO
function startTimer(sec) {
clearInterval(timerInterval);
timerSeconds = sec;
updateTimerDisplay();
timerInterval = setInterval(() => {
timerSeconds--;
updateTimerDisplay();
if (timerSeconds <= 0) {
clearInterval(timerInterval);
playBeepSound();
alert("⏱️ Descanso concluído! Próxima série.");
}
}, 1000);
}
function stopTimer() {
clearInterval(timerInterval);
timerSeconds = 0;
updateTimerDisplay();
}
function updateTimerDisplay() {
const m = Math.floor(timerSeconds / 60);
const s = timerSeconds % 60;
document.getElementById('timerDisplay').textContent =
⁠${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}⁠;
}
function playBeepSound() {
try {
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const osc = ctx.createOscillator();
osc.type = 'sine';
osc.frequency.setValueAtTime(880, ctx.currentTime);
osc.connect(ctx.destination);
osc.start();
osc.stop(ctx.currentTime + 0.4);
} catch(e){}
}
// EXERCÍCIOS & PROTOCOLOS
function quickAdd(nome, cat, series, detalhes) {
state.exercicios.push({
nome, cat, series, detalhes,
completedSets: new Array(Number(series)).fill(false)
});
autoSaveAll();
renderExercicios();
}
function addExercicioManualmente() {
const nome = document.getElementById('in_ex_nome').value.trim();
const cat = document.getElementById('in_ex_cat').value;
const series = document.getElementById('in_ex_series').value || "4";
const detalhes = document.getElementById('in_ex_detalhes').value || "-";
if (!nome) {
alert("Por favor digite o nome do exercício.");
return;
}
state.exercicios.push({
nome, cat, series, detalhes,
completedSets: new Array(Number(series)).fill(false)
});
document.getElementById('in_ex_nome').value = '';
autoSaveAll();
renderExercicios();
}
function toggleSet(exIdx, setIdx) {
if (!state.exercicios[exIdx].completedSets) {
state.exercicios[exIdx].completedSets = new Array(Number(state.exercicios[exIdx].series)).fill(false);
}
state.exercicios[exIdx].completedSets[setIdx] = !state.exercicios[exIdx].completedSets[setIdx];
// Inicia timer de descanso automático de 60s ao marcar a série
if (state.exercicios[exIdx].completedSets[setIdx]) {
startTimer(60);
}
autoSaveAll();
renderExercicios();
}
function removeExercicio(idx) {
state.exercicios.splice(idx, 1);
autoSaveAll();
renderExercicios();
}
function renderExercicios() {
const container = document.getElementById('listaExercicios');
if (!container) return;
if (state.exercicios.length === 0) {
container.innerHTML = ⁠<span class="text-xs text-[var(--text-muted)] italic text-center py-2 block">Nenhum exercício registrado para o treino de hoje.</span>⁠;
return;
}
container.innerHTML = state.exercicios.map((ex, idx) => {
let icon = "🏋️‍♂️";
if (ex.cat === "Natação") icon = "🏊";
if (ex.cat === "Aeróbico") icon = "🏃";
const numSeries = Number(ex.series) || 1;
let checkboxes = '';
for (let s = 0; s < numSeries; s++) {
const isChecked = ex.completedSets && ex.completedSets[s];
checkboxes += ⁠<div class="flex items-center gap-1"> <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleSet(${idx}, ${s})" class="set-check" title="Série ${s+1}"> <span class="text-[9px] text-[var(--text-muted)] font-bold">${s+1}</span> </div>⁠;
}
return `
<div class="bg-black/40 p-3 rounded-xl border border-[var(--glass-border)] flex flex-col gap-2">
<div class="flex items-center justify-between">
<div>
<strong class="text-xs text-white block font-bold">${icon} ￼
￼{ex.cat} · ￼{ex.detalhes})</span>
</div>
<button onclick="removeExercicio(${idx})" class="text-[var(--text-muted)] hover:text-red-400 text-xs font-bold border-none bg-transparent cursor-pointer">✕</button>
</div>
<div class="flex items-center justify-between pt-1 border-t border-white/5">
<span class="text-[10px] text-[var(--text-muted)] font-bold uppercase">Séries Concluídas:</span>
<div class="flex items-center gap-2">
${checkboxes}
</div>
</div>
</div>
`;
}).join('');
}
function salvarNovoProtocolo() {
const nome = document.getElementById('in_nome_protocolo').value.trim();
if (!nome) {
alert("Digite um nome para o protocolo antes de salvar!");
return;
}
if (state.exercicios.length === 0) {
alert("Adicione pelo menos 1 exercício para salvar como protocolo!");
return;
}
state.protocolos[nome] = [...state.exercicios];
document.getElementById('in_nome_protocolo').value = '';
autoSaveAll();
renderProtocolosSelect();
alert(⁠Protocolo "${nome}" salvo no dispositivo!⁠);
}
function renderProtocolosSelect() {
const sel = document.getElementById('sel_protocolo');
if (!sel) return;
let html = ⁠<option value="padrao">-- Selecionar Protocolo --</option>⁠;
Object.keys(state.protocolos || {}).forEach(pName => {
html += ⁠<option value="${pName}">${pName}</option>⁠;
});
sel.innerHTML = html;
}
function carregarProtocolo() {
const pName = document.getElementById('sel_protocolo').value;
if (pName && state.protocolos[pName]) {
state.exercicios = JSON.parse(JSON.stringify(state.protocolos[pName]));
autoSaveAll();
renderExercicios();
}
}
function updateWhatsAppLinks() {
const hoje = new Date().toLocaleDateString('pt-BR');
let msg = ⁠*FITVOX — RELATÓRIO DE PERFORMANCE* 🚀\n⁠;
msg += ⁠📅 Data: ${hoje}\n\n⁠;
if (state.audioLivro) {
msg += ⁠🎧 *Ouvindo no VisionVox:* ${state.audioLivro}\n⁠;
if (state.insight) msg += ⁠💡 *Insights:* "${state.insight}"\n⁠;
msg += ⁠\n⁠;
}
if (state.exercicios.length > 0) {
msg += ⁠🏋️ *Resumo dos Treinos de Hoje:*\n⁠;
state.exercicios.forEach(ex => {
const doneSets = ex.completedSets ? ex.completedSets.filter(Boolean).length : 0;
msg += ⁠• *${ex.nome}* (${ex.cat}): ${doneSets}/${ex.series} séries | ${ex.detalhes}\n⁠;
});
} else {
msg += ⁠• Nenhum exercício registrado hoje.\n⁠;
}
msg += ⁠\n_Gerado via FitVox Tracker_ ⚡⁠;
const cleanPhone = (state.phone || '').replace(/\D/g, '');
const link = ⁠https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}⁠;
const btnTop = document.getElementById('btnTopWhatsApp');
const btnBottom = document.getElementById('btnBottomWhatsApp');
if (btnTop) btnTop.href = link;
if (btnBottom) btnBottom.href = link;
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
