<script>

    if(canal === "whatsapp"){
      hooks = [
        "Eai, tudo bem? Vi que você se interessou pelo " + p + ". Ele tá disponível sim.",

      ];
      corpo = "O " + p + " está seminovo, testado, com nota e IMEI consultado. Aceito Pix e dinheiro na hora. Se fechar hoje, eu dou mais R$50 de desconto e entrego hoje mesmo na sua região.";
      cta = "Quer que eu reserve pra você? Só R$50 de sinal e o resto na entrega.";

    } else if(canal === "instagram"){
      hooks = [
        "Quanto você acha que eu paguei nesse " + p + "? Menos do que você imagina. Vou te mostrar.",
        "Ninguém te conta o segredo de comprar " + p + " barato de verdade. Olha esse.",
        "Se você tá pensando em comprar " + p + ", NÃO compra antes de ver esse vídeo."
      ];
      corpo = "Tenho sempre unidades de " + p + " com preço de revendedor, seminovos, testados e com garantia de 30 dias. Atualizo a lista todo dia.";
      cta = "Chama no Direct ou no WhatsApp que eu passo a lista de hoje — link na bio.";
      o1 = "É original? — Original, com nota. Posto vídeo testando antes de vender.";
      o2 = "Por que tão barato? — Compro em lote e quero girar rápido, não porque tem problema.";
      o3 = "Entrega em outra cidade? — Sim, envio para todo Brasil com seguro e rastreio.";
    } else if(canal === "marketplace"){
      hooks = [
        p + " — MENOR PREÇO DA REGIÃO, levo R$200 menos hoje",
        "Vendo " + p + " por PREÇO DE USADO, mas estado de novo (olha as fotos)",
        "URGENTE: " + p + " — preciso vender até amanhã, preço abaixo do mercado"
      ];
      corpo = p + ", seminovo, sem arranhões na tela, carregador e caixa originais. Vendo abaixo do mercado porque preciso fechar uma compra hoje e quero girar o dinheiro rápido. Primeiro que vier e levar, leva. Não reservo sem sinal. Aceito Pix e dinheiro na hora. Testa aí na sua frente, sem compromisso.";
      cta = "Chama no WhatsApp agora (link na bio) e reserva o seu — se demorar, passa pra frente.";
      o1 = "É original? — Original, com nota e IMEI. Testa na hora.";
      o2 = "Tem garantia? — 30 dias por escrito.";
      o3 = "Aceita cartão? — Só Pix ou dinheiro na entrega. Por isso o preço é mais baixo.";
    } else {
      hooks = [
        "POV: você acabou de encontrar o " + p + " mais barato da internet 👀",
        "Eu pago muito menos por " + p + " do que você. Vou te mostrar onde.",
        "Esse " + p + " custou menos de R$2 mil. Adivinha como?"

      cta = 'Comenta "QUERO" que eu te mando o link da lista no direct.';
      o1 = "É golpe? — Não, entrego na hora e você testa antes de pagar.";
      o2 = "Tem em outra cidade? — Envio para todo Brasil com seguro.";
      o3 = "Aceita troca? — Só vendo, não troco.";

    let intro = "";
    if(obj === "lead") intro = "🎯 OBJETIVO: gerar contato. Use tom de curiosidade, não fale de preço no primeiro contato.\n\n";
    else if(obj === "fechar") intro = "🔥 OBJETIVO: fechar venda quente. Seja direto, ofereça desconto de hoje e peça sinal.\n\n";
    else intro = "⏰ OBJETIVO: follow-up. Seja leve, não pressione, reative o interesse.\n\n";

    let saida = intro + "📌 3 GANCHOS (escolha um):\n1. " + hooks[0] + "\n2. " + hooks[1] + "\n3. " + hooks[2] + "\n\n📝 CORPO DA MENSAGEM / LEGENDA:\n" + corpo + "\n\n👉 CHAMADA PARA AÇÃO (CTA):\n" + cta + "\n\n🛡 MATRIZ DE OBJEÇÕES:\n• " + o1 + "\n• " + o2 + "\n• " + o3;

    if(obj === "followup"){
      saida += "\n\n💬 MENSAGENS DE FOLLOW-UP (1ª em 24h, 2ª em 3 dias, 3ª em 7 dias):\n1. Eai, só passando pra lembrar que o " + p + " ainda tá disponível. Se fechar hoje, mantenho o preço com desconto.\n2. Oi! Tudo bem? O " + p + " continua aqui. Se tiver dúvida sobre estado ou garantia, me fala que eu te mostro vídeo testando.\n3. Última mensagem, ok? O " + p + " vai sair do preço promocional amanhã. Se quiser garantir, é só chamar. Se não, te desejo ótima compra em outro lugar!";
    }

    const saidaEl = document.getElementById('sc_saida');
    if(saidaEl) saidaEl.innerText = saida;
  } catch(err) {
    console.error('Erro ao gerar script:', err);
  }
}

function copiarScript(ev){
  const txt = document.getElementById('sc_saida').innerText;
  navigator.clipboard.writeText(txt).then(()=>{
    const btn = ev.target; 
    const original = btn.innerText;
    btn.innerText = "✅ Copiado!"; 
    setTimeout(() => btn.innerText = original, 1500);
  }).catch(err => {
    console.error('Erro ao copiar:', err);
  });
}

document.addEventListener('DOMContentLoaded', gerarScript);
gerarScript();
</script>
